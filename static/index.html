<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Officer Workstation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99; transition: opacity 0.5s ease; }
    .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00adb5; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading-text { font-size: 1.1rem; color: #00adb5; }
    #ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(8px); padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 10; max-width: 280px; }
    #ui-panel h2 { font-size: 1rem; margin-bottom: 8px; color: #00adb5; }
    #ui-panel p { font-size: 0.8rem; line-height: 1.4; color: #ccc; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Memuat Officer Workstation... (0%)</div>
  </div>

  <div id="ui-panel">
    <h2>👨‍💼 Officer Workstation</h2>
    <p>• <b>Klik Kiri + Geser:</b> Putar Kamera</p>
    <p>• <b>Klik Kanan + Geser:</b> Geser Posisi</p>
    <p>• <b>Scroll:</b> Zoom In / Out</p>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181c);

    // Camera setup
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Ruangan Ukuran Pas (6x6 meter)
    const floorGeo = new THREE.PlaneGeometry(6, 6);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x282c34, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3e4451, roughness: 0.9 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
    backWall.position.set(0, 1.75, -3);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.5), wallMat);
    leftWall.position.set(-3, 1.75, 0);
    leftWall.rotation.y = Math.PI / 2;
    scene.add(leftWall);

    // Layout 1 Officer Workstation Proper
    const officeAssets = [
      // Karpet Dasar
      { name: 'Rug.glb', pos: [0, 0.01, 0], rot: [0, 0, 0], scale: [1.2, 1, 1.2] },
      
      // Meja & Kursi Kerja
      { name: 'Table.glb', pos: [0, 0, 0], rot: [0, 0, 0], scale: [1, 1, 1] },
      { name: 'Office Chair.glb', pos: [0, 0, 1.1], rot: [0, 0, 0], scale: [1, 1, 1] },
      
      // Perangkat Komputer di Atas Meja
      { name: 'Monitor.glb', pos: [0, 0.75, -0.2], rot: [0, 0, 0], scale: [0.7, 0.7, 0.7] },
      { name: 'Mousepad.glb', pos: [0, 0.74, 0.25], rot: [0, 0, 0], scale: [0.8, 1, 0.8] },
      { name: 'Keyboard.glb', pos: [-0.1, 0.75, 0.25], rot: [0, 0, 0], scale: [0.6, 0.6, 0.6] },
      { name: 'Mouse.glb', pos: [0.35, 0.75, 0.25], rot: [0, 0, 0], scale: [0.6, 0.6, 0.6] },
      { name: 'Coffee cup.glb', pos: [-0.6, 0.75, 0.1], rot: [0, 0, 0], scale: [0.8, 0.8, 0.8] },
      
      // Sisi Kiri Meja (Kabinet & Printer)
      { name: 'File Cabinet.glb', pos: [-1.8, 0, -0.2], rot: [0, Math.PI / 2, 0], scale: [0.9, 0.9, 0.9] },
      { name: 'Printer.glb', pos: [-1.8, 0.75, -0.2], rot: [0, Math.PI / 2, 0], scale: [0.8, 0.8, 0.8] },
      { name: 'Trashcan.glb', pos: [-1.4, 0, 0.8], rot: [0, 0, 0], scale: [0.8, 0.8, 0.8] },

      // Sisi Belakang Ruangan (Dekorasi & Papan Kerja)
      { name: 'Medium Book Shelf.glb', pos: [1.8, 0, -2.5], rot: [0, 0, 0], scale: [0.9, 0.9, 0.9] },
      { name: 'Whiteboard.glb', pos: [-0.8, 1.6, -2.9], rot: [0, 0, 0], scale: [0.8, 0.8, 0.8] },
      { name: 'Analog clock.glb', pos: [1.2, 2.5, -2.9], rot: [0, 0, 0], scale: [0.8, 0.8, 0.8] },

      // Tanaman Ruangan
      { name: 'Potted Plant.glb', pos: [-2.3, 0, -2.3], rot: [0, 0, 0], scale: [0.9, 0.9, 0.9] }
    ];

    const loader = new GLTFLoader();
    let loadedCount = 0;
    const totalAssets = officeAssets.length;
    const loadingText = document.getElementById('loading-text');
    const loadingScreen = document.getElementById('loading-screen');

    function updateProgress() {
      loadedCount++;
      const progress = Math.round((loadedCount / totalAssets) * 100);
      loadingText.innerText = `Memuat Officer Workstation... (${progress}%)`;
      if (loadedCount === totalAssets) {
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 500);
        }, 300);
      }
    }

    officeAssets.forEach(asset => {
      const fileUrl = `/static/models/office/${asset.name}`;

      loader.load(
        fileUrl,
        (gltf) => {
          const model = gltf.scene;
          model.position.set(...asset.pos);
          model.rotation.set(...asset.rot);
          model.scale.set(...asset.scale);

          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          scene.add(model);
          updateProgress();
        },
        undefined,
        (error) => {
          console.warn(`File tidak ditemukan/dilewati: ${asset.name}`);
          updateProgress();
        }
      );
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
