<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Room 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #111115; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f1115; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid rgba(0, 173, 181, 0.2);
      border-top-color: #00adb5; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 0.95rem; color: #a0aec0; letter-spacing: 0.5px; }

    #ui-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 20px;
      border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
    }
    #ui-panel h2 { font-size: 1rem; margin-bottom: 6px; color: #00adb5; }
    #ui-panel p { font-size: 0.8rem; line-height: 1.4; color: #cbd5e0; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Memuat Model 3D Office & Character...</div>
  </div>

  <div id="ui-panel">
    <h2>🏢 Office & Avatar 3D</h2>
    <p>• <b>Klik Kiri + Geser:</b> Putar Tampilan</p>
    <p>• <b>Klik Kanan + Geser:</b> Geser Kamera</p>
    <p>• <b>Scroll:</b> Zoom</p>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Scene, Camera, Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111115);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1, 0);

    // 2. Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight(0x00adb5, 1.5, 10);
    fillLight.position.set(-3, 3, -2);
    scene.add(fillLight);

    // 3. Daftar File Model GLB yang akan dimuat
    // Memastikan path fleksibel membaca dari folder relatif/lokal
    const modelFiles = [
      'models/office.glb',
      'models/character.glb',
      'models/avatar.glb',
      'models/office_room.glb',
      'models/desk.glb',
      'models/chair.glb'
    ];

    const loadingManager = new THREE.LoadingManager();
    const loader = new GLTFLoader(loadingManager);

    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    loadingManager.onProgress = (url, itemsLoaded, itemsTotal) => {
      loadingText.innerText = `Memuat file model (${itemsLoaded}/${itemsTotal})...`;
    };

    loadingManager.onLoad = () => {
      setTimeout(() => {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => loadingOverlay.style.display = 'none', 500);
      }, 300);
    };

    // Fungsi pembantu untuk memuat model dengan error handling safe
    function loadModel(path) {
      return new Promise((resolve) => {
        loader.load(
          path,
          (gltf) => resolve({ status: 'success', gltf, path }),
          undefined,
          (error) => resolve({ status: 'error', error, path })
        );
      });
    }

    // Load semua file secara paralel
    let loadedCount = 0;
    Promise.all(modelFiles.map(file => loadModel(file))).then(results => {
      results.forEach(res => {
        if (res.status === 'success') {
          const model = res.gltf.scene;
          
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          // Mengatur posisi khusus jika avatar terpisah
          if (res.path.includes('character') || res.path.includes('avatar')) {
            model.position.set(0, 0, 0.5); // Posisi duduk/berdiri di area kerja
          }

          scene.add(model);
          loadedCount++;
        }
      });

      // Jika file folder lokal tidak ketemu, muat model default dari CDN sebagai fallback
      if (loadedCount === 0) {
        loadingText.innerText = 'Memuat model office default dari CDN...';
        loader.load(
          'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF-Binary/SheenChair.glb',
          (gltf) => {
            scene.add(gltf.scene);
          }
        );
      }
    });

    // 4. Responsive Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
