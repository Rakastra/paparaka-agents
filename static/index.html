<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantor Sup · Board 2.5D</title>
<style>
  :root { --bg:#171a21; --panel:rgba(24,28,36,.86); --text:#e8ecf1; --muted:#9aa5b4; --accent:#f2b56b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, #232834 0%, var(--bg) 70%);
    color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; cursor:grab; }
  canvas.drag { cursor:grabbing; } canvas.pick { cursor:pointer; }
  .panel { position:fixed; z-index:5; background:var(--panel); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08); border-radius:12px; }
  #head { top:16px; left:16px; padding:12px 14px; max-width:calc(100vw - 32px); }
  #head h1 { font-size:1rem; font-weight:650; } #head h1 span { color:var(--accent); }
  #head p { font-size:.74rem; color:var(--muted); margin:2px 0 10px; }
  #chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font:inherit; font-size:.76rem;
    color:var(--text); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); cursor:pointer; }
  .chip:hover, .chip.on { border-color:var(--accent); background:rgba(242,181,107,.14); }
  .chip i { width:9px; height:9px; border-radius:50%; }
  #card { left:16px; bottom:16px; padding:12px 14px; width:min(300px, calc(100vw - 100px)); display:none; }
  #card b { font-size:.95rem; } #card small { color:var(--muted); display:block; margin:1px 0 8px; font-size:.74rem; }
  #card div { font-size:.8rem; display:flex; gap:7px; align-items:center; } #card div i { width:8px; height:8px; border-radius:50%; background:#6fd08c; flex:none; }
  #zoom { right:16px; bottom:16px; display:flex; flex-direction:column; overflow:hidden; }
  #zoom button { width:38px; height:38px; background:none; border:0; color:var(--text); font-size:1.1rem; cursor:pointer; }
  #zoom button:hover { background:rgba(255,255,255,.08); } #zoom button + button { border-top:1px solid rgba(255,255,255,.08); }
  #hint { right:70px; bottom:22px; padding:7px 11px; font-size:.72rem; color:var(--muted); }
  #chat { left:16px; bottom:16px; width:min(340px, calc(100vw - 32px)); max-height:min(430px, 62vh); display:none; flex-direction:column; overflow:hidden; }
  #chat header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.08); font-size:.86rem; font-weight:600; }
  #chat header i { width:8px; height:8px; border-radius:50%; background:#6fd08c; box-shadow:0 0 8px #6fd08c; }
  #chat header small { color:var(--muted); font-weight:400; font-size:.7rem; margin-left:auto; }
  #chat header button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:1rem; }
  #log { flex:1; overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-height:90px; }
  .m { max-width:90%; padding:7px 10px; border-radius:12px; font-size:.8rem; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .m.me { align-self:flex-end; background:rgba(242,181,107,.2); } .m.sup { align-self:flex-start; background:rgba(255,255,255,.07); }
  .m.sys { align-self:center; background:none; color:var(--muted); font-size:.72rem; text-align:center; }
  #quick { display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 8px; }
  #quick button { font:inherit; font-size:.7rem; color:var(--muted); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:3px 9px; cursor:pointer; }
  #quick button:hover { color:var(--text); border-color:var(--accent); }
  #cform { display:flex; gap:6px; padding:8px 10px; border-top:1px solid rgba(255,255,255,.08); }
  #cin { flex:1; min-width:0; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px 10px; color:var(--text); font:inherit; font-size:.82rem; outline:0; }
  #cin:focus { border-color:var(--accent); }
  #cform button { background:var(--accent); color:#1b1e26; border:0; border-radius:8px; padding:0 13px; font-weight:650; cursor:pointer; }
  #cform button:disabled { opacity:.5; cursor:default; }
  @media (max-width:640px) { #hint { display:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Papan kantor isometrik 2.5D"></canvas>
<div id="head" class="panel"><h1>Kantor <span>Sup</span></h1><p>Board 2.5D · klik bidak untuk detail</p><div id="chips"></div><button id="dbtn" class="chip" style="margin-top:8px">🚪 Pintu CEO: Otomatis</button></div>
<div id="card" class="panel"></div>
<div id="chat" class="panel"><header><i></i>Sup <small>AI Agent · online</small><button id="cx" aria-label="Tutup">✕</button></header>
  <div id="log" aria-live="polite"></div>
  <div id="quick"><button>Halo Sup</button><button>🪑 Kembali ke kursi</button><button>Bantu split bill</button></div>
  <form id="cform"><input id="cin" placeholder="Tulis pesan untuk Sup…" maxlength="500" autocomplete="off"><button id="csend">Kirim</button></form></div>
<div id="hint" class="panel">Klik Sup → chat &amp; klik lantai untuk berjalan · Klik pintu = buka/tutup · Seret = geser</div>
<div id="zoom" class="panel"><button id="zi" aria-label="Perbesar">+</button><button id="zo" aria-label="Perkecil">−</button><button id="zr" aria-label="Reset">⟲</button></div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 16, TW = 96, TH = 48, WH = 150;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, base = 1, zoom = 1, cam = { x: 0, y: 0 }, t = 0;
const S = () => base * zoom;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  base = Math.min(W / (N * TW * 1.15), H / (N * TH + WH + 140));
}
const P = (x, y, z = 0) => { const s = S();
  return [W / 2 + cam.x + (x - y) * TW / 2 * s, H / 2 + cam.y + (((x + y) - N) * TH / 2 - z + 68) * s]; };

function shade(h, f) {
  const n = parseInt(h.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; } else { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function poly(pts, fill, stroke) {
  ctx.beginPath(); pts.forEach((p, i) => { const [a, b] = P(...p); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function drawBox(x, y, w, d, h, c, z0, e = 'rgba(0,0,0,.14)') {
  poly([[x, y + d, z0], [x + w, y + d, z0], [x + w, y + d, z0 + h], [x, y + d, z0 + h]], shade(c, .72), e);   // sisi kiri
  poly([[x + w, y, z0], [x + w, y + d, z0], [x + w, y + d, z0 + h], [x + w, y, z0 + h]], shade(c, .88), e);   // sisi kanan
  poly([[x, y, z0 + h], [x + w, y, z0 + h], [x + w, y + d, z0 + h], [x, y + d, z0 + h]], shade(c, 1.12), e);  // atas
}
function drawCyl(cx, cy, r, h, c, z0) {
  const [sx, sy] = P(cx, cy, z0), s = S(), rx = r * TW * .7071 * s, ry = r * TH * .7071 * s, hp = h * s;
  ctx.fillStyle = shade(c, .8); ctx.fillRect(sx - rx, sy - hp, rx * 2, hp);
  ctx.beginPath(); ctx.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx, sy - hp, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = shade(c, 1.12); ctx.fill();
}
const items = [];
const add = (d, fn) => items.push({ d, fn });
const box = (x, y, w, d, h, c, z0 = 0, bn = 0) => add(x + w / 2 + y + d / 2 + z0 / 1000 + bn, () => drawBox(x, y, w, d, h, c, z0));
const cyl = (cx, cy, r, h, c, z0 = 0, bn = 0) => add(cx + cy + z0 / 1000 + bn, () => drawCyl(cx, cy, r, h, c, z0));

// ---------- Furnitur ----------
const WOOD = '#e4cfa8', LEG = '#5a4a38', DARK = '#2b2f36';
const SILVER = '#c9ccd1';
function laptop(x, y, o, sc, dz = 0, k = 1.3) {      // MacBook terbuka di atas meja
  const z = 32 + dz, w = .7 * k, d = .42 * k, lh = 24 * k, T = .04, kb = '#aeb2b9';
  if (o === 'S') {                                    // layar menghadap +y
    box(x, y + T, w, d, 2, SILVER, z); box(x, y, w, T, lh, SILVER, z + 2);
    add(x + w / 2 + y + .3, () => { const yy = y + T + .002;
      poly([[x + .02, yy, z + 4], [x + w - .02, yy, z + 4], [x + w - .02, yy, z + lh], [x + .02, yy, z + lh]], '#15171c');
      poly([[x + .05, yy + .002, z + 6], [x + w - .05, yy + .002, z + 6], [x + w - .05, yy + .002, z + lh - 3], [x + .05, yy + .002, z + lh - 3]], sc); });
    box(x + w * .17, y + d * .45, w * .66, d * .38, .6, kb, z + 2);
  } else if (o === 'N') {                             // layar menghadap -y (pengguna di sisi belakang meja)
    box(x, y, w, d, 2, SILVER, z); box(x, y + d, w, T, lh, SILVER, z + 2);
    box(x + w * .17, y + d * .2, w * .66, d * .38, .6, kb, z + 2);
    add(x + w / 2 + y + d + .3, () => { const [sx, sy] = P(x + w / 2, y + d + T + .002, z + 2 + lh / 2), r = S();
      ctx.fillStyle = '#f5f5f7'; ctx.beginPath(); ctx.ellipse(sx, sy, 4.5 * r, 5.5 * r, 0, 0, 7); ctx.fill(); });
  } else {                                            // 'E': layar menghadap +x
    box(x + T, y, d, w, 2, SILVER, z); box(x, y, T, w, lh, SILVER, z + 2);
    add(x + .3 + y + w / 2, () => { const xx = x + T + .002;
      poly([[xx, y + .02, z + 4], [xx, y + w - .02, z + 4], [xx, y + w - .02, z + lh], [xx, y + .02, z + lh]], '#15171c');
      poly([[xx + .002, y + .05, z + 6], [xx + .002, y + w - .05, z + 6], [xx + .002, y + w - .05, z + lh - 3], [xx + .002, y + .05, z + lh - 3]], sc); });
    box(x + d * .45, y + w * .17, d * .38, w * .66, .6, kb, z + 2);
  }
}
function legs(x, y, w, d, h, c) { [[.04, .04], [w - .12, .04], [.04, d - .12], [w - .12, d - .12]].forEach(([a, b]) => box(x + a, y + b, .08, .08, h, c)); }
function stool(cx, cy) { cyl(cx, cy, .04, 16, '#555b66'); cyl(cx, cy, .2, 4, '#d2674a', 16); }
function line(pts, col, wd = 1) { ctx.beginPath(); pts.forEach(([a, b, z], i) => { const [px, py] = P(a, b, z); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.stroke(); }
const PLAN = [[.12, .15, .62, .15], [.62, .15, .62, .75], [.62, .75, .12, .75], [.12, .75, .12, .15], [.12, .45, .62, .45], [.37, .15, .37, .45], [.72, .2, .9, .2], [.72, .35, .9, .35], [.72, .5, .9, .5]];
function blueprint(x, y, w, d, z = 32.2) {              // lembar cetak biru: kertas biru + grid + denah
  poly([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], '#2f6db5', '#1d4f8c');
  const g = (u, v) => [x + u * w, y + v * d, z + .1];
  for (let i = 1; i < 6; i++) { line([g(i / 6, 0), g(i / 6, 1)], 'rgba(255,255,255,.25)'); line([g(0, i / 6), g(1, i / 6)], 'rgba(255,255,255,.25)'); }
  PLAN.forEach(([a, b, c, d2]) => line([g(a, b), g(c, d2)], '#ffffff', 1.2));
}
function draftingTable(x, y) {                         // meja gambar arsitek (papan miring)
  [[.08, .08, 56], [1.64, .08, 56], [.08, .72, 38], [1.64, .72, 38]].forEach(([a, b, h]) => box(x + a, y + b, .08, .08, h, '#5a4a38'));
  add(x + .9 + y + .46, () => { const bp = (u, v) => [x + .1 + u * 1.6, y + .1 + v * .7, 56 - 16 * v];
    poly([bp(0, 0), bp(1, 0), bp(1, 1), bp(0, 1)], '#efe9d8', '#5a4a38');
    poly([[x + .1, y + .8, 40], [x + 1.7, y + .8, 40], [x + 1.7, y + .8, 35], [x + .1, y + .8, 35]], '#5a4a38');
    PLAN.forEach(([a, b, c, d]) => line([bp(a, b), bp(c, d)], '#2f6db5', 1.2));
    line([bp(0, .62), bp(1, .62)], '#c9a26b', 3); });
}
function civilDesk(x, y) {                             // meja teknik sipil: blueprint, maket, gulungan, helm proyek
  box(x, y, 1.8, .9, 6, '#e4cfa8', 26); legs(x, y, 1.8, .9, 26, '#5a4a38');
  add(x + .6 + y + .46, () => blueprint(x + .1, y + .12, 1.0, .66));
  box(x + 1.25, y + .1, .3, .3, 12, '#c5cbd3', 32); box(x + 1.3, y + .15, .2, .2, 10, '#dde2e8', 44);
  box(x + 1.2, y + .5, .5, .09, 5, '#f0e6d6', 32); box(x + 1.2, y + .62, .5, .09, 5, '#e8d9b8', 32);
  add(x + 1.5 + y + .85, () => { const [sx, sy] = P(x + 1.5, y + .78, 32), s = S();
    ctx.fillStyle = '#d9a91c'; ctx.beginPath(); ctx.ellipse(sx, sy, 11 * s, 4.5 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.ellipse(sx, sy - 4 * s, 8 * s, 8 * s, 0, Math.PI, 0); ctx.fill(); });
}
function workbench(x, y) {                             // meja workshop: catok, perkakas, kayu
  box(x, y, .9, 1.8, 8, '#8a6a45', 28); legs(x, y, .9, 1.8, 28, '#4a3a2a'); box(x + .05, y + .05, .8, 1.7, 3, '#6b4f33', 10);
  box(x + .06, y + .1, .26, .26, 10, '#555b66', 36); box(x + .1, y + .36, .18, .06, 10, '#3a3f46', 36);
  box(x + .5, y + 1.15, .32, .5, 10, '#c9432f', 36); box(x + .58, y + 1.35, .16, .1, 3, '#8f2f20', 46);
  box(x + .42, y + .5, .07, .42, 2, '#a07c52', 36); box(x + .38, y + .45, .15, .1, 6, '#444a52', 36);
  box(x + .3, y + .95, .55, .18, 3, '#d9b27a', 36); box(x + .35, y + .97, .45, .14, 3, '#c99d62', 39);
  cyl(x + .2, y + .8, .07, 8, '#9aa5b4', 36); cyl(x + .2, y + 1.05, .06, 6, '#e8c26a', 36);
}
function planTable(x, y) {                             // meja denah: blueprint besar + maket + gulungan
  box(x, y, .9, 1.8, 6, '#e4cfa8', 26); legs(x, y, .9, 1.8, 26, '#5a4a38');
  add(x + .45 + y + .9, () => blueprint(x + .08, y + .1, .74, .95));
  box(x + .12, y + 1.2, .3, .3, 16, '#c5cbd3', 32); box(x + .5, y + 1.25, .25, .25, 10, '#dde2e8', 32); box(x + .16, y + 1.24, .22, .22, 8, '#e8ecf0', 48);
  cyl(x + .65, y + 1.62, .1, 14, '#4b6d8b', 32); [[-.04, 0], [.03, -.03], [.05, .04]].forEach(([a, b], k) => cyl(x + .65 + a, y + 1.62 + b, .03, 20 + k * 3, '#f0e6d6', 44));
}
function chair(cx, cy, back, c) {
  box(cx - .06, cy - .06, .12, .12, 12, '#444a55');
  box(cx - .28, cy - .28, .56, .56, 8, c, 12);
  const b = { N: [cx - .28, cy - .34, .56, .08], S: [cx - .28, cy + .26, .56, .08], W: [cx - .34, cy - .28, .08, .56], E: [cx + .26, cy - .28, .08, .56] }[back];
  box(b[0], b[1], b[2], b[3], 22, c, 20);
}
function plant(x, y, k) {
  add(x + y, () => {
    drawCyl(x, y, .22 * k, 18 * k, '#c9744f', 0);
    const [sx, sy] = P(x, y, 18 * k), s = S() * k;
    for (let i = 0; i < 7; i++) { const a = i * 0.9 + 1;
      ctx.save(); ctx.translate(sx + Math.cos(a) * 7 * s, sy - (14 + (i % 3) * 9) * s); ctx.rotate(Math.cos(a) * .6);
      ctx.beginPath(); ctx.ellipse(0, 0, 6 * s, 17 * s, 0, 0, Math.PI * 2); ctx.fillStyle = shade(i % 2 ? '#5f9c5c' : '#79b66f', 1); ctx.fill(); ctx.restore(); }
  });
}

// Lantai, papan, karpet, dinding
add(-1e6, () => {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40 * dpr; ctx.shadowOffsetY = 18 * dpr;
  poly([[0, 0, -16], [N, 0, -16], [N, N, -16], [0, N, -16]], '#4a3320'); ctx.restore();
  poly([[0, N, 0], [N, N, 0], [N, N, -16], [0, N, -16]], '#6b4a2b');
  poly([[N, 0, 0], [N, N, 0], [N, N, -16], [N, 0, -16]], '#7d5834');
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    poly([[i, j, 0], [i + 1, j, 0], [i + 1, j + 1, 0], [i, j + 1, 0]], (i + j) % 2 ? '#c9a26b' : '#be9660', 'rgba(0,0,0,.1)');
});
const TB = { x: 6.4, y: 6.2 };
function ring(r, z, fill) { const pts = []; for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; pts.push([TB.x + Math.cos(a) * r, TB.y + Math.sin(a) * r, z]); } poly(pts, fill); }
add(-9e5, () => { ring(2.1, .4, '#3d5a73'); ring(1.8, .5, '#4b6d8b'); });
add(-8e5, () => {                                   // dinding (potongan) + jendela + papan tulis
  outerWalls();
  poly([[1.3, 0, 70], [3.3, 0, 70], [3.3, 0, 125], [1.3, 0, 125]], '#bfe3ff', '#5b4630');
  poly([[2.3, 0, 70], [2.3, 0, 125]].concat([[2.3, 0, 125], [2.3, 0, 70]]), null, '#5b4630');
  poly([[6.95, 0, 70], [8.55, 0, 70], [8.55, 0, 125], [6.95, 0, 125]], '#bfe3ff', '#5b4630');
  poly([[6.95, 0, 128], [8.55, 0, 128], [8.55, 0, 146], [6.95, 0, 146]], '#f7f4ee', '#5b4630');
  const [tx, ty] = P(7.75, 0, 137); ctx.save(); ctx.translate(tx, ty); ctx.transform(1, .5, 0, 1, 0, 0);   // teks mengikuti bidang dinding
  ctx.fillStyle = '#2b2f36'; ctx.font = `700 ${Math.max(7, 10 * S())}px "Segoe UI", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('CEO OFFICE', 0, 0); ctx.restore();
  poly([[0, 4.7, 62], [0, 6.3, 62], [0, 6.3, 112], [0, 4.7, 112]], '#f4f4f0', '#4a4f57');
  [[4.9, 5.8, 100, '#e0594f'], [4.9, 5.5, 90, '#3f7fd4'], [5.1, 6.1, 80, '#4aa86a']].forEach(([a, b, z, c]) => poly([[0, a, z], [0, b, z], [0, b, z + 3], [0, a, z + 3]], c));
  poly([[0, 2.5, 55], [0, 4.1, 55], [0, 4.1, 108], [0, 2.5, 108]], '#c9b58a', '#8a6d4b');
  [[2.65, 2.75, 70, 100, '#9aa5b4'], [2.9, 3.0, 75, 98, '#c9432f'], [3.15, 3.35, 70, 92, '#555b66'], [3.5, 3.9, 88, 94, '#a07c52'], [3.5, 3.9, 70, 76, '#9aa5b4'], [3.6, 3.7, 58, 68, '#e8c26a']]
    .forEach(([a, b, z1, z2, c]) => poly([[0, a, z1], [0, b, z1], [0, b, z2], [0, a, z2]], c));
  poly([[3.7, 0, 72], [5.1, 0, 72], [5.1, 0, 112], [3.7, 0, 112]], '#2f6db5', '#e8ecf1');
  [[3.85, 5.0, 100], [3.85, 5.0, 92], [3.85, 4.5, 84]].forEach(([a, b, z]) => line([[a, 0, z], [b, 0, z]], 'rgba(255,255,255,.8)', 1.5));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const list = items.concat(agents.map(p => ({ d: p.x + p.y + .1, fn: () => drawPawn(p) })));
  list.sort((a, b) => a.d - b.d);
  const sm = sel === agents[0], col = sm ? (hoverOK ? ['rgba(111,208,140,.3)', '#6fd08c'] : ['rgba(224,89,79,.3)', '#e0594f']) : ['rgba(242,181,107,.28)', '#f2b56b'];
  const hi = list.filter(it => it.d < -8.5e5).length - 1;
  list.forEach((it, i) => { it.fn(); if (i === hi && hoverTile) poly(hoverTile.map(([a, b]) => [a, b, .6]), col[0], col[1]); });
  agents.forEach(drawLabel); drawBubble(agents[0]);
  if (sel) cardStatus();
}
let last = performance.now();
(function loop(now) { update(Math.min(.05, (now - last) / 1000)); last = now; frame(); requestAnimationFrame(loop); })(last);

// ---------- Interaksi ----------
const card = document.getElementById('card'), chips = document.getElementById('chips');
function cardStatus() { const el = card.querySelector('[data-st]'); if (el) el.textContent = sel.st; }
const $ = id => document.getElementById(id), chat = $('chat'), log = $('log'), cin = $('cin'), csend = $('csend');
const hist = []; let busy = false;
function addMsg(cls, text) { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; }
function say(p, text, ms = 8000) { p.say = text; p.sayUntil = t + ms / 1000; }
function select(p) {
  sel = p; [...chips.children].forEach((b, i) => b.classList.toggle('on', agents[i] === p));
  card.style.display = 'none'; chat.style.display = 'none'; if (!p) return;
  if (p.ai) { chat.style.display = 'flex'; if (!log.children.length) addMsg('sys', 'Terhubung ke AI Agent Sup'); say(p, 'Halo! Ada yang bisa saya bantu?', 4000); setTimeout(() => cin.focus(), 60); return; }
  card.style.display = 'block'; card.innerHTML = '';
  const b = document.createElement('b'), s = document.createElement('small'), d = document.createElement('div'), i = document.createElement('i'), sp = document.createElement('span'), n = document.createElement('small');
  b.textContent = p.n; s.textContent = p.role; sp.dataset.st = ''; sp.textContent = p.st; d.append(i, sp);
  n.style.marginTop = '8px'; n.textContent = 'Belum terintegrasi dengan AI Agent'; card.append(b, s, d, n);
}
async function ask(text) {
  text = text.trim(); if (busy || !text) return; busy = true; csend.disabled = true; const sup = agents[0];
  addMsg('me', text); hist.push({ role: 'user', content: text }); sup.think = true; sup.st = 'Sedang berpikir…';
  const wait = addMsg('sup', '…');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: hist.slice(-7, -1) }) });
    if (!r.ok) throw new Error(r.status);
    const rep = (await r.json()).reply || '(tidak ada balasan)';
    wait.textContent = rep; hist.push({ role: 'assistant', content: rep }); say(sup, rep);
  } catch (e) {
    const m = 'Maaf, saya belum bisa terhubung ke server. Coba lagi sebentar ya.'; wait.textContent = m; wait.classList.add('sys'); say(sup, m, 5000);
  } finally { sup.think = false; sup.st = sup.moving ? 'Berjalan…' : supIdle(); busy = false; csend.disabled = false; log.scrollTop = log.scrollHeight; cin.focus(); }
}
$('cform').addEventListener('submit', e => { e.preventDefault(); const v = cin.value; cin.value = ''; ask(v); });
$('quick').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') return;
  const v = e.target.textContent; v.startsWith('🪑') ? moveSup(SEAT.x, SEAT.y + .1, true) : ask(v); });
const dbtn = $('dbtn'), MODE = { auto: 'Otomatis', open: 'Selalu buka', closed: 'Selalu tutup' };
function setMode(m) { door.mode = m; dbtn.textContent = '🚪 Pintu CEO: ' + MODE[m]; dbtn.classList.toggle('on', m !== 'auto'); }
const cycleDoor = () => setMode(door.mode === 'auto' ? 'open' : door.mode === 'open' ? 'closed' : 'auto');
dbtn.onclick = cycleDoor;
function moveSup(tx, ty, seat) {
  const s0 = agents[0]; const pass = door.mode !== 'closed'; let path = findPath(s0.x, s0.y, tx, ty, pass);
  if (!path && !pass) { path = findPath(s0.x, s0.y, tx, ty, true); if (path) { setMode('auto'); say(s0, 'Pintu kubuat otomatis lagi ya', 2500); } }
  if (!path) { say(s0, 'Aku tidak bisa ke sana 😅', 3000); return; }
  s0.path = path; s0.toSeat = seat; s0.tz = 0; s0.seated = false; s0.st = 'Berjalan…';
  if (!seat && path.length) path[path.length - 1] = [tx, ty];
}
$('cx').onclick = () => select(null);
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
// Pesan WhatsApp nyata (aktif bila backend menyalakan SHOW_ACTIVITY=1)
let lastEv = null;
async function poll() {
  if (document.hidden) return;
  try { const r = await fetch('/api/activity?since=' + (lastEv ?? 0)); if (!r.ok) return; const j = await r.json();
    if (lastEv === null) { lastEv = j.last; return; }
    j.events.forEach(e => { lastEv = Math.max(lastEv, e.id); addMsg('sys', '📩 WhatsApp ' + e.sender + ': ' + e.message); addMsg('sup', e.reply); say(agents[0], '📩 ' + e.message + '\n→ ' + e.reply, 9000); });
  } catch (e) { /* backend belum tersedia */ }
}
setInterval(poll, 5000); poll();
agents.forEach(p => { const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = '<i></i>'; b.firstChild.style.background = p.c;
  b.append(p.n); b.onclick = () => select(sel === p ? null : p); chips.append(b); });

const pickAt = (mx, my) => agents.slice().sort((a, b) => b.x + b.y - a.x - a.y).find(p => Math.hypot(mx - p.hx, my - p.hy) < p.hr);
function inPoly(pts, x, y) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
  const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const hitDoor = (mx, my) => inPoly([[DG[0], RD + .12, 0], [DG[1], RD + .12, 0], [DG[1], RD + .12, GH], [DG[0], RD + .12, GH]].map(p => P(...p)), mx, my);
function onTap(mx, my) {
  const hit = pickAt(mx, my); if (hit) { select(hit); return; }
  if (hitDoor(mx, my)) { cycleDoor(); return; }
  const g = gridAt(mx, my), sup = agents[0];
  if (sel === sup && g) { const [gx, gy] = g;
    if (gx >= SEAT.x - .28 && gx <= SEAT.x + .28 && gy >= .2 && gy <= .8) moveSup(SEAT.x, SEAT.y + .1, true); else moveSup(gx, gy, false); return; }
  select(null);
}
function gridAt(mx, my) { const s = S(), a = (mx - W / 2 - cam.x) / (TW / 2 * s), bb = (my - H / 2 - cam.y) / s - 68, b = bb / (TH / 2) + N;
  const gx = (a + b) / 2, gy = (b - a) / 2; return (gx < 0 || gy < 0 || gx >= N || gy >= N) ? null : [gx, gy]; }
function tileAt(mx, my) { const g = gridAt(mx, my); if (!g) return null; const i = g[0] | 0, j = g[1] | 0; return [[i, j], [i + 1, j], [i + 1, j + 1], [i, j + 1]]; }
let drag = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
cv.addEventListener('pointermove', e => {
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 5) { drag.moved = true; cv.className = 'drag'; }
    if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; clampCam(); } return; }
  hov = pickAt(e.clientX, e.clientY) || null; const dh = !hov && hitDoor(e.clientX, e.clientY);
  hoverTile = (hov || dh) ? null : tileAt(e.clientX, e.clientY); const g = gridAt(e.clientX, e.clientY);
  hoverOK = g ? !gridO[cellOf(g[0])][cellOf(g[1])] : false; cv.className = (hov || dh) ? 'pick' : '';
});
cv.addEventListener('pointerup', e => { if (drag && !drag.moved) onTap(e.clientX, e.clientY); drag = null; cv.className = ''; });
cv.addEventListener('pointerleave', () => { hov = null; hoverTile = null; });
function clampCam() { const mx = W * .6, my = H * .6; cam.x = Math.max(-mx, Math.min(mx, cam.x)); cam.y = Math.max(-my, Math.min(my, cam.y)); }
function setZoom(z, px = W / 2, py = H / 2) { const o = S(); zoom = Math.max(.6, Math.min(2.4, z)); const r = S() / o;
  cam.x = (px - W / 2) - ((px - W / 2) - cam.x) * r; cam.y = (py - H / 2) - ((py - H / 2) - cam.y) * r; clampCam(); }
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY); }, { passive: false });
document.getElementById('zi').onclick = () => setZoom(zoom * 1.2);
document.getElementById('zo').onclick = () => setZoom(zoom / 1.2);
document.getElementById('zr').onclick = () => { zoom = 1; cam.x = cam.y = 0; };
addEventListener('resize', resize); resize();
})();
</script>
