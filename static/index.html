<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sims Style 3D Office - AI Agent Sup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #20242a; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #181a1f; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid rgba(0, 173, 181, 0.2);
      border-top-color: #00adb5; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 0.95rem; color: #00adb5; letter-spacing: 0.5px; }

    #ui-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 20px;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
    }
    #ui-panel h2 { font-size: 1.1rem; margin-bottom: 8px; color: #00adb5; display: flex; align-items: center; gap: 6px; }
    #ui-panel p { font-size: 0.82rem; line-height: 1.5; color: #cbd5e0; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Mencari & Memuat Aset 3D Office...</div>
  </div>

  <div id="ui-panel">
    <h2>🏠 The Sims Style Office Room</h2>
    <p>• <b>Klik Kiri + Drag:</b> Rotasi Kamera (Isometrik)</p>
    <p>• <b>Klik Kanan + Drag:</b> Geser Posisi Ruangan</p>
    <p>• <b>Scroll:</b> Zoom In / Zoom Out</p>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d24);

    // 1. Orthographic Camera Setup (Sudut Pandang Isometrik ala The Sims)
    const aspect = window.innerWidth / window.innerHeight;
    const d = 10;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    
    // Posisi Isometrik Khas The Sims (Tampilan dari Sudut Atas Miring)
    camera.position.set(20, 20, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    // 2. Environment & Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(15, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    scene.add(dirLight);

    // Lantai Grid Ruangan (Lantai / Floor Room)
    const floorGeometry = new THREE.PlaneGeometry(16, 16);
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(16, 16, 0x00adb5, 0x4c566a);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Dinding Belakang khas Isometrik (Dua Sisi Saja)
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3b4252 });
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 0.2), wallMaterial);
    backWall.position.set(0, 4, -8);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const sideWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 8, 16), wallMaterial);
    sideWall.position.set(-8, 4, 0);
    sideWall.receiveShadow = true;
    scene.add(sideWall);

    // 3. Auto Loader Aset GLB dari API backend
    const loader = new GLTFLoader();
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    async function loadAllModels() {
      try {
        const response = await fetch('/api/models');
        const data = await response.json();
        const modelUrls = data.models || [];

        if (modelUrls.length === 0) {
          loadingText.innerText = 'Tidak ada file .glb ditemukan di folder static/models/';
          setTimeout(() => loadingOverlay.style.display = 'none', 1500);
          return;
        }

        let loadedCount = 0;
        const totalModels = modelUrls.length;

        // Susun tata letak item secara berbaris/grid agar tidak menumpuk di pusat (0,0,0)
        const gridSize = Math.ceil(Math.sqrt(totalModels));
        const spacing = 2.2;
        const startX = -((gridSize - 1) * spacing) / 2;
        const startZ = -((gridSize - 1) * spacing) / 2;

        for (let i = 0; i < modelUrls.length; i++) {
          const url = modelUrls[i];
          const fileName = url.split('/').pop();
          loadingText.innerText = `Memuat model (${i + 1}/${totalModels}): ${fileName}`;

          try {
            const gltf = await new Promise((resolve, reject) => {
              loader.load(url, resolve, undefined, reject);
            });

            const model = gltf.scene;

            // Hitung bounding box agar objek tepat berada di atas lantai
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());

            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            // Posisikan secara grid di atas lantai
            const row = Math.floor(i / gridSize);
            const col = i % gridSize;
            const x = startX + col * spacing;
            const z = startZ + row * spacing;

            model.position.set(x, -box.min.y, z);
            scene.add(model);
            loadedCount++;

          } catch (err) {
            console.warn(`Gagal memuat file: ${url}`, err);
          }
        }

        loadingText.innerText = `Selesai memuat ${loadedCount} model!`;
        setTimeout(() => {
          loadingOverlay.style.opacity = '0';
          setTimeout(() => loadingOverlay.style.display = 'none', 500);
        }, 300);

      } catch (error) {
        console.error('Gagal mengambil daftar model:', error);
        loadingText.innerText = 'Terjadi kesalahan saat memuat aset.';
      }
    }

    loadAllModels();

    // 4. Responsive Window Resize
    window.addEventListener('resize', () => {
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
