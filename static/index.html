<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Officer Workstation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(8px); padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 10; max-width: 280px; }
    #ui-panel h2 { font-size: 1rem; margin-bottom: 8px; color: #00adb5; }
    #ui-panel p { font-size: 0.8rem; line-height: 1.4; color: #ccc; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui-panel">
    <h2>👨‍💼 Officer Workstation</h2>
    <p>• <b>Klik Kiri + Geser:</b> Putar Kamera</p>
    <p>• <b>Klik Kanan + Geser:</b> Geser Posisi</p>
    <p>• <b>Scroll:</b> Zoom In / Out</p>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, Camera, Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.2, 0);

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const deskLight = new THREE.PointLight(0x00adb5, 0.8, 5);
    deskLight.position.set(0, 2.5, 0);
    scene.add(deskLight);

    // Helper Function untuk buat Mesh
    function createBox(w, h, d, color, x, y, z, rx=0, ry=0, rz=0) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // 3. RUANGAN (Lantai & Dinding)
    const floorGeo = new THREE.PlaneGeometry(8, 8);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x22242b, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2d313b, roughness: 0.9 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
    backWall.position.set(0, 2.5, -4);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
    leftWall.position.set(-4, 2.5, 0);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    // Karpet Karakter
    createBox(3.5, 0.01, 3, 0x393e46, 0, 0.005, 0.2);

    // 4. MEJA KERJA (Officer Desk)
    // Papan Meja Utas Kayu
    createBox(2.4, 0.08, 1.2, 0x8d5b4c, 0, 1.2, 0);
    // Kaki Meja Metal
    createBox(0.08, 1.2, 1.1, 0x222222, -1.1, 0.6, 0);
    createBox(0.08, 1.2, 1.1, 0x222222, 1.1, 0.6, 0);

    // Laci Meja Kanan
    createBox(0.5, 0.5, 0.9, 0x333333, 0.75, 0.9, 0);

    // 5. PERANGKAT KOMPUTER
    // Stand & Layar Monitor Dual Setup
    createBox(0.4, 0.02, 0.2, 0x111111, 0, 1.25, -0.2);
    createBox(0.05, 0.35, 0.05, 0x111111, 0, 1.42, -0.2);
    // Monitor Utama
    createBox(1.1, 0.6, 0.03, 0x222222, 0, 1.7, -0.2);
    createBox(1.04, 0.54, 0.01, 0x00adb5, 0, 1.7, -0.18); // Layar Menyala
    
    // Keyboard & Mousepad
    createBox(0.9, 0.01, 0.35, 0x1b1b1b, 0, 1.24, 0.25); // Deskmat
    createBox(0.5, 0.02, 0.16, 0xeeeeee, -0.1, 1.25, 0.25); // Keyboard
    createBox(0.08, 0.02, 0.12, 0xeeeeee, 0.28, 1.25, 0.25); // Mouse

    // Cangkir Kopi
    const cupGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.12, 16);
    const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const cup = new THREE.Mesh(cupGeo, cupMat);
    cup.position.set(-0.7, 1.3, 0.1);
    cup.castShadow = true;
    scene.add(cup);

    // 6. KURSI KERJA (Office Chair)
    // Dudukan & Sandaran
    createBox(0.6, 0.08, 0.6, 0x22252a, 0, 0.7, 1.1);
    createBox(0.55, 0.65, 0.08, 0x22252a, 0, 1.05, 1.36);
    // Tiang & Kaki Kursi
    const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 12);
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.set(0, 0.5, 1.1);
    scene.add(stem);
    createBox(0.6, 0.04, 0.6, 0x111111, 0, 0.35, 1.1);

    // 7. PERALATAN TAMBAHAN RUANGAN
    // Rak Buku Belakang
    createBox(1.2, 2.2, 0.4, 0x4a3525, -2.8, 1.1, -3.5);
    createBox(1.1, 0.04, 0.38, 0x3a2515, -2.8, 0.8, -3.5);
    createBox(1.1, 0.04, 0.38, 0x3a2515, -2.8, 1.4, -3.5);

    // Papan Tulis (Whiteboard)
    createBox(1.8, 1.1, 0.03, 0xdddddd, 0.8, 2.4, -3.95);
    createBox(1.86, 1.16, 0.01, 0x8d5b4c, 0.8, 2.4, -3.97); // Bingkai kayu

    // Tanaman Hias (Potted Plant)
    const potGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.4, 16);
    const potMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
    const pot = new THREE.Mesh(potGeo, potMat);
    pot.position.set(2.8, 0.2, -3.2);
    pot.castShadow = true;
    scene.add(pot);

    const plantGeo = new THREE.DodecahedronGeometry(0.35);
    const plantMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
    const plant = new THREE.Mesh(plantGeo, plantMat);
    plant.position.set(2.8, 0.55, -3.2);
    plant.castShadow = true;
    scene.add(plant);

    // Tempat Sampah
    const binGeo = new THREE.CylinderGeometry(0.18, 0.14, 0.4, 16);
    const binMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const bin = new THREE.Mesh(binGeo, binMat);
    bin.position.set(1.4, 0.2, 0.1);
    bin.castShadow = true;
    scene.add(bin);

    // 8. Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 9. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
