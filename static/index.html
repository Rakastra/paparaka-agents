<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sims-Style Startup Office - AI Agent Sup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1d24; color: #ffffff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111318; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid rgba(0, 173, 181, 0.2);
      border-top-color: #00adb5; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 0.95rem; color: #00adb5; letter-spacing: 0.5px; }

    #ui-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 20px;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
    }
    #ui-panel h2 { font-size: 1.1rem; margin-bottom: 8px; color: #00adb5; }
    #ui-panel p { font-size: 0.82rem; line-height: 1.5; color: #cbd5e0; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Memuat Referensi Desain Kantor 3D...</div>
  </div>

  <div id="ui-panel">
    <h2>🏠 Startup Office (The Sims Style)</h2>
    <p>• <b>Klik Kiri + Drag:</b> Rotasi Kamera Isometrik</p>
    <p>• <b>Klik Kanan + Drag:</b> Geser Ruangan</p>
    <p>• <b>Scroll:</b> Zoom In / Out</p>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Setup Scene & Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d24);

    // 2. Kamera Orthographic Isometrik (Khas The Sims)
    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 5;
    const camera = new THREE.OrthographicCamera(
      -viewSize * aspect, viewSize * aspect,
      viewSize, -viewSize,
      0.1, 1000
    );
    
    // Sudut Pandang Isometrik dari Atas Miring
    camera.position.set(10, 10, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.25; // Supaya tidak bisa melihat dari bawah lantai
    controls.target.set(0, 0, 0);

    // 3. Lighting Ruangan (Hangat & Estetik)
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(12, 18, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0001;
    scene.add(dirLight);

    const softFillLight = new THREE.PointLight(0x00adb5, 0.6, 12);
    softFillLight.position.set(-6, 4, -6);
    scene.add(softFillLight);

    // 4. Fallback Model CDN Ruangan Utuh (Khronos / Open Repo Sample)
    const SAMPLE_ROOM_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/SheenChair/glTF-Binary/SheenChair.glb';
    
    // Alternatif Model Ruangan Utuh dari Khronos Repository
    const SAMPLE_INTERIOR_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ShadowStudio.glb';

    const loader = new GLTFLoader();
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    async function loadOffice() {
      try {
        // Cek file lokal terlebih dahulu
        const res = await fetch('/api/models');
        const data = await res.json();
        const localModels = data.models || [];

        // Jika tidak ada model lokal ruangan yang valid, muat referensi model ruangan utuh
        let targetUrl = SAMPLE_INTERIOR_URL;

        if (localModels.length > 0) {
          // Cari jika ada file office_room / room / office
          const roomFile = localModels.find(m => m.toLowerCase().includes('office') || m.toLowerCase().includes('room'));
          if (roomFile) {
            targetUrl = roomFile;
          }
        }

        loadingText.innerText = 'Memuat model ruangan kantor 3D...';

        loader.load(
          targetUrl,
          (gltf) => {
            const model = gltf.scene;

            // Auto Centering & Auto Scaling agar berada tepat di tengah & proporsional
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scale = 5 / maxDim; // Menyesuaikan ke ukuran layar
              model.scale.set(scale, scale, scale);
            }

            model.position.x -= center.x * (5 / maxDim);
            model.position.y -= box.min.y * (5 / maxDim);
            model.position.z -= center.z * (5 / maxDim);

            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            scene.add(model);

            loadingText.innerText = 'Model Ruangan Berhasil Dimuat!';
            setTimeout(() => {
              loadingOverlay.style.opacity = '0';
              setTimeout(() => loadingOverlay.style.display = 'none', 500);
            }, 300);
          },
          (xhr) => {
            if (xhr.lengthComputable) {
              const percent = Math.round((xhr.loaded / xhr.total) * 100);
              loadingText.innerText = `Memuat Aset: ${percent}%`;
            }
          },
          (error) => {
            console.warn('Gagal memuat model utama, memuat fallback...', error);
            // Fallback jika terjadi kegagalan jaringan
            loader.load(SAMPLE_ROOM_URL, (gltf) => {
              scene.add(gltf.scene);
              loadingOverlay.style.display = 'none';
            });
          }
        );

      } catch (err) {
        console.error('Error inisialisasi kantor:', err);
      }
    }

    loadOffice();

    // 5. Handling Resize Layar
    window.addEventListener('resize', () => {
      const newAspect = window.innerWidth / window.innerHeight;
      camera.left = -viewSize * newAspect;
      camera.right = viewSize * newAspect;
      camera.top = viewSize;
      camera.bottom = -viewSize;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Loop Animasi
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
